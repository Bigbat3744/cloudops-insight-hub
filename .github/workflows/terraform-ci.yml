name: terraform-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: terraform/aws

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6

      - name: Lint
        run: tflint --init && tflint

      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/aws
          config_file: terraform/aws/.checkov.yaml
          framework: terraform
          quiet: true
          soft_fail: false

  plan:
    name: Terraform plan
    needs: checks
    runs-on: ubuntu-latest
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Sign in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cloudops-github-plan
          aws-region: us-east-1

      - name: Init (S3 backend)
        run: >
          terraform init -input=false
          -backend-config="bucket=cloudops-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          -backend-config="key=cloudops-insight-hub/aws/terraform.tfstate"
          -backend-config="region=eu-west-2"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=60s
